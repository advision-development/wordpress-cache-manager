name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor the plugin header claims. A grep for PHP 8-only syntax in
        # build.sh is not the same as running the suite on 7.4, which the scanners
        # learned by shipping without it.
        php: [ '7.4', '8.3' ]

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: Run the suite
        run: ./tests/run.sh
