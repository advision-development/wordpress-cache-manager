name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Read only: the suite needs to see the code and nothing else.
permissions:
  contents: read

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor the plugin header claims. A grep for PHP 8-only syntax in
        # build.sh is not the same as running the suite on 7.4, which the scanners
        # learned by shipping without it.
        # 8.4 because production runs it; a deprecation there is a fatal in the next one.
        php: [ '7.4', '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: Run the suite
        run: ./tests/run.sh
